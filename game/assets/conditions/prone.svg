  <circle cx="50" cy="50" r="46.0" fill="#1c1f26" stroke="#f2d36b" stroke-width="6" />
  <circle cx="27" cy="52" r="8" fill="#f4f1ea" />
  <rect x="37" y="46" width="40" height="12" rx="6" fill="#f4f1ea" />
  <rect x="22" y="66" width="58" height="5" rx="2.5" fill="#f4f1ea" />
</svg>
